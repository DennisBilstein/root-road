<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seite ohne die Fehler</title>
  <style>
    body { font: 1rem/1.6 system-ui, sans-serif; padding: 1rem; background: #fff; color: #172438; }
    button, input { min-height: 2.75rem; font: inherit; }
    :focus-visible { outline: 3px solid #174d9e; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Gute Seite</h1>
    <h2>Ebenen in Reihenfolge</h2>
    <p>Ausreichender Kontrast für normalen Text.</p>
    <img src="bilder/lernkarte-480.svg" width="480" height="320" alt="Lernkarte mit blauem Rahmen">
    <label for="suche">Suchbegriff</label>
    <input id="suche" name="suche" type="search">
    <button type="button">Suchen</button>
  </main>
</body>
</html>
